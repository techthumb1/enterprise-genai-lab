[project]
name = "enterprise-genai-lab"
version = "0.1.0"
description = "Enterprise AI Risk and Document Intelligence reference implementation"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.116",
    "uvicorn[standard]>=0.35",
    "pydantic>=2.13,<2.14",
    "pydantic-settings>=2.15,<3",
    "langgraph>=1.2,<2",
    "openai>=1.100",
    "anthropic>=0.60",
    "sqlalchemy[asyncio]>=2.1,<3",
    "asyncpg>=0.30",
    "alembic>=1.20,<2",
    "pgvector>=0.5,<1",
    "httpx>=0.28,<1",
    "logfire[fastapi,sqlalchemy,httpx]>=5.1,<6",
    "opentelemetry-api>=1.44,<2",
    "opentelemetry-sdk>=1.44,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.2,<2",
    "pytest-cov>=7,<8",
    "ruff>=0.16,<1",
    "mypy>=2.3,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true